<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="home" href="/tabs/home">
      <ion-icon name="home-outline"></ion-icon>
      <ion-label>首頁</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="auction" href="/tabs/auction">
      <ion-icon name="hammer-outline"></ion-icon>
      <ion-label>拍賣</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="map" href="/tabs/map">
      <ion-icon name="map-outline"></ion-icon>
      <ion-label>地圖</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="sell" href="/tabs/sell">
      <ion-icon name="add-circle-outline"></ion-icon>
      <ion-label>刊登</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="profile" href="/tabs/profile">
      <ion-icon name="person-outline"></ion-icon>
      <ion-label>我的</ion-label>
      @if (unreadCount > 0) {
        <ion-badge color="danger">{{ unreadCount }}</ion-badge>
      }
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
